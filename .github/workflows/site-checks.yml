name: Site consistency

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-publish consistency checks
        run: python3 tools/check-consistency.py
