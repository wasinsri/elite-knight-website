name: Direct article footer patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[article-footer-direct]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add static footer to article HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const footer = `    <footer class="bg-slate-950 py-12 text-slate-300">
      <div class="mx-auto grid max-w-7xl gap-8 px-5 md:grid-cols-3 lg:px-8">
        <div><div class="flex items-center gap-3"><img class="footer-mark" src="../assets/logo.jpg" alt="Elite Knight Co., Ltd. logo"><p class="text-lg font-black text-white">บริษัท เอลีท ไนท์ จำกัด</p></div><p class="mt-3 text-sm leading-6">Engineering the Future with Data and AI</p></div>
        <div class="grid gap-2 text-sm"><a href="../index.html">หน้าแรก</a><a href="../about.html">ความเชี่ยวชาญ</a><a href="../services.html">บริการ</a><a href="../insights.html">คลังความรู้</a><a href="../contact.html">ติดต่อเรา</a><a href="../cookie-policy.html">นโยบายการใช้งานคุกกี้</a><div class="mt-2 flex gap-3"><a class="social-icon" href="https://x.com/" target="_blank" rel="noopener" aria-label="Elite Knight on X">X</a><a class="social-icon" href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Elite Knight on Facebook">f</a><a class="social-icon" href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="Elite Knight on LinkedIn">in</a></div></div>
        <div class="text-sm leading-7"><p>เลขที่ 1/128 หมู่บ้านอิ่มอัมพร ซอยทวีวัฒนา 20 ถนนทวีวัฒนา แขวงศาลาธรรมสพน์ เขตทวีวัฒนา กรุงเทพมหานคร 10170</p><p>เปิดบริการ: จันทร์ - ศุกร์ 9.00 - 17.30 น.</p><p>Mobile: 063-664-1555</p><p>Email: info@ek.co.th</p></div>
      </div>
    </footer>
`;
          const files = ['articles/data-governance-ai.html','articles/cyber-resilience-executive-metrics.html','articles/digital-strategy-to-portfolio.html'];
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            html = html.replace(/\n\s*<footer class="bg-slate-950 py-12 text-slate-300">[\s\S]*?<\/footer>\n\s*<script src="\.\.\/assets\/site\.js"><\/script>/, '\n    <script src="../assets/site.js"></script>');
            if (!html.includes('<footer class="bg-slate-950 py-12 text-slate-300">')) {
              html = html.replace('    <script src="../assets/site.js"></script>', `${footer}    <script src="../assets/site.js"></script>`);
            }
            fs.writeFileSync(file, html);
          }
          fs.rmSync('.github/workflows/article-footer-direct.yml');
          NODE
      - name: Commit static footers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/data-governance-ai.html articles/cyber-resilience-executive-metrics.html articles/digital-strategy-to-portfolio.html .github/workflows/article-footer-direct.yml
          git commit -m "Add static footers to article pages" || exit 0
          git push
